{% extends "base.html" %}
{% block content %}
<h1>Add known word</h1>
{% if message %}<p class="muted">{{ message }}</p>{% endif %}
<form method="post" action="/known/add" autocomplete="off">
    <label>Language <select name="lang">
        {% for code, pack in langs %}<option value="{{ code }}">{{ pack.flag }} {{ pack.name }}</option>{% endfor %}
    </select></label>
    <label>Word <input type="text" name="target" autofocus placeholder="Russian: leave blank to transliterate from latin"></label>
    <label>Latin <input type="text" name="romanized" placeholder="Russian only"></label>
    <label>English <input type="text" name="english" required placeholder="gloss1, gloss2"></label>
    <button type="submit">add</button>
</form>
<p class="muted nav-links"><a href="/study">back to study</a></p>
{% endblock %}

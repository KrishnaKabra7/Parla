<div id="card" class="card">
{% if card_type == "voice" %}
    <audio id="audio" src="/audio/{{ audio }}" autoplay></audio>
    <div class="replay-row">
        <button type="button" class="replay" onclick="var a=document.getElementById('audio');a.playbackRate=1;a.currentTime=0;a.play()" aria-label="replay">▶</button>
        <button type="button" class="replay slow" onclick="var a=document.getElementById('audio');a.playbackRate=0.6;a.currentTime=0;a.play()" aria-label="replay slow">🐢</button>
    </div>
    <form hx-post="/review" hx-target="#card" hx-swap="outerHTML" hx-indicator="#spinner" autocomplete="off">
        <input type="hidden" name="sentence_id" value="{{ sentence_id }}">
        <input type="text" name="typed" autofocus placeholder="type what you heard">
        <button type="submit">check</button>
    </form>
{% elif card_type == "text" %}
    <p class="prompt">{{ prompt }}</p>
    <p class="muted">answer in {{ hint_lang }}</p>
    <form hx-post="/review/text" hx-target="#card" hx-swap="outerHTML" hx-indicator="#spinner" autocomplete="off">
        <input type="hidden" name="known_word_id" value="{{ known_word_id }}">
        <input type="hidden" name="direction" value="{{ direction }}">
        <input type="text" name="typed" autofocus placeholder="type the translation">
        <button type="submit">check</button>
    </form>
{% else %}
    <p class="muted">all caught up — come back later.</p>
{% endif %}
</div>

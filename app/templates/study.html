{% extends "base.html" %}
{% block content %}
<form class="mode-toggle" method="post">
    {% for m in ["mixed", "voice", "text"] %}
    <button type="submit" formaction="/mode/{{ m }}"{% if mode == m %} class="active"{% endif %}>{{ m }}</button>
    {% endfor %}
</form>
<p class="muted">practicing {% for p in chosen %}{{ p.flag }} {{ p.name }}{% if not loop.last %}, {% endif %}{% endfor %} · <a href="/langs">change</a></p>
{% include "_card.html" %}
<div id="spinner" class="htmx-indicator spinner">generating…</div>
<p class="muted nav-links">
    <a href="/words">words</a> · <a href="/stats">stats</a> · <a href="/known/add">add word</a>
</p>
<script>
document.addEventListener('keydown', (e) => {
    if (e.target.matches('input,textarea')) return;
    const audio = document.getElementById('audio');
    if ((e.key === 'r' || e.key === 'R') && audio) { audio.play(); e.preventDefault(); return; }
    const map = {'1': '0', '2': '3', '3': '4', '4': '5'};
    if (e.key in map) {
        const btn = document.querySelector(`.grades button[value="${map[e.key]}"]`);
        if (btn) { btn.click(); e.preventDefault(); }
    }
});
document.addEventListener('click', (e) => {
    const span = e.target.closest('.tok.flag');
    if (!span) return;
    const wid = span.dataset.wordId;
    const holder = document.getElementById('flagged');
    if (!holder) return;
    const existing = holder.querySelector(`input[value="${wid}"]`);
    span.classList.toggle('missed');
    if (existing) {
        existing.remove();
    } else {
        const inp = document.createElement('input');
        inp.type = 'hidden';
        inp.name = 'flagged_word_ids';
        inp.value = wid;
        holder.appendChild(inp);
    }
});
</script>
{% endblock %}

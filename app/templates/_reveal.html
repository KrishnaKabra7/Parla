<div id="card" class="card">
    {% if audio %}
    <audio id="audio" src="/audio/{{ audio }}" preload="auto"></audio>
    <div class="replay-row">
        <button type="button" class="replay" onclick="var a=document.getElementById('audio');a.playbackRate=1;a.currentTime=0;a.play()" aria-label="replay">▶</button>
        <button type="button" class="replay slow" onclick="var a=document.getElementById('audio');a.playbackRate=0.6;a.currentTime=0;a.play()" aria-label="replay slow">🐢</button>
    </div>
    {% endif %}
    <p class="reveal">
{%- for tok in tokens -%}
<span class="tok{% if tok.matched %} good{% endif %}{% if tok.is_target %} target{% endif %}{% if tok.flag_word_id %} flag{% endif %}"{% if tok.flag_word_id %} data-word-id="{{ tok.flag_word_id }}"{% endif %}>{{ tok.text }}</span>{{ " " }}
{%- endfor -%}
    </p>
    {% if latin %}<p class="translit">{{ latin }}</p>{% endif %}
    {% if gloss %}<p class="gloss">{{ gloss }}</p>{% endif %}
    {% if typed %}<p class="typed">you typed: {{ typed }}</p>{% endif %}
    <form hx-post="/grade" hx-target="#card" hx-swap="outerHTML" hx-indicator="#spinner">
        <input type="hidden" name="sentence_id" value="{{ sentence_id }}">
        <input type="hidden" name="typed" value="{{ typed }}">
        <div id="flagged" hidden></div>
        <div class="grades">
            <button type="submit" name="grade" value="0" class="g-again">Again</button>
            <button type="submit" name="grade" value="3" class="g-hard">Hard</button>
            <button type="submit" name="grade" value="4" class="g-good">Good</button>
            <button type="submit" name="grade" value="5" class="g-easy">Easy</button>
        </div>
    </form>
</div>
